name: Release

# Builds DXVK-MacOS's lanes and the MoltenVK they run on:
#   x86_64    d3d8, d3d9, d3d10core, d3d11 and dxgi for x86_64 Windows programs (x86_64-windows)
#   i386      the same for 32-bit programs (i386-windows)
#   arm64x    the same as ARM64X for an arm64 Wine that runs x86_64 programs with FEX (MetalSharp Wine), which
#             loads them as ARM64EC from x86_64-windows, so DXVK itself is not emulated
#   moltenvk  the universal libMoltenVK.dylib and its ICD file, built by metalsharp/VKD3D-Proton-MacOS's scripts
#             from its pinned MoltenVK and SPIRV-Cross with its patches, the same MoltenVK its releases ship
# A pushed tag vX.Y publishes them as one release, vX.Y, with each part a package of its own. Pull requests that
# change the build, and runs started by hand, only build them (the archives are the run's artifacts).

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'patches/**'
      - 'build-*.txt'
      - 'tools/ci/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  LLVM_MINGW_VERSION: '20261020'
  # metalsharp/VKD3D-Proton-MacOS commit whose MoltenVK build to ship: MoltenVK and SPIRV-Cross with the fixes
  # DXVK 3.1 needs (workgroup sizes from LocalSizeId, runtime-sized descriptor arrays, compute shaders with
  # groupshared memory, geometry pipelines without multisample state, geometry shader limits). It is on the
  # dxvk-3.1-arm64x branch (metalsharp/VKD3D-Proton-MacOS#8): move it to main's commit once that is merged.
  VKD3D_PROTON_MACOS_REPO: metalsharp/VKD3D-Proton-MacOS
  VKD3D_PROTON_MACOS_REV: 8b62043bca33ab6044f542440211fb748ee59ccc

jobs:
  dlls:
    name: ${{ matrix.lane }} DLLs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: x86_64
            cross: build-win64.txt
            dir: x86_64-windows
          - lane: i386
            cross: build-win32.txt
            dir: i386-windows
          - lane: arm64x
            cross: build-arm64x.txt
            dir: x86_64-windows
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y glslang-tools meson ninja-build python3 zstd
          if [ "${{ matrix.lane }}" = arm64x ]; then
            curl -fsSL -o "$RUNNER_TEMP/llvm-mingw.tar.xz" \
              "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64.tar.xz"
            tar -xf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"
          else
            sudo apt-get install --no-install-recommends -y \
              g++-mingw-w64-x86-64 g++-mingw-w64-i686 gcc-mingw-w64-x86-64 gcc-mingw-w64-i686
          fi

      - name: MoltenVK shader compiler patch
        run: git -C subprojects/dxbc-spirv apply ../../patches/dxbc-spirv-moltenvk.patch

      - name: Build
        run: |
          meson setup build \
            --cross-file "${{ matrix.cross }}" \
            --buildtype release \
            --strip \
            --wrap-mode nodownload \
            --prefix "$PWD/stage" \
            --bindir "${{ matrix.dir }}" \
            --libdir "${{ matrix.dir }}" \
            -Db_ndebug=if-release
          meson compile -C build
          meson install -C build

      - name: Check architecture
        run: |
          set -euo pipefail
          file stage/${{ matrix.dir }}/*.dll
          case "${{ matrix.lane }}" in
            arm64x) python3 tools/ci/check-arm64x.py stage/${{ matrix.dir }}/*.dll ;;
            x86_64) ! file stage/${{ matrix.dir }}/*.dll | grep -E 'ARM|80386' ;;
            i386)   ! file stage/${{ matrix.dir }}/*.dll | grep -E 'ARM|x86-64' ;;
          esac

      - name: Package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION="$(git rev-parse --short HEAD)"
          NAME="dxvk-macos-$VERSION-${{ matrix.lane }}"
          ROOT="$RUNNER_TEMP/$NAME"
          mkdir -p "$ROOT/${{ matrix.dir }}"
          cp stage/${{ matrix.dir }}/*.dll "$ROOT/${{ matrix.dir }}/"
          cp LICENSE "$ROOT/LICENSE"
          cp subprojects/dxbc-spirv/LICENSE "$ROOT/LICENSE.dxbc-spirv"
          cp dxvk.conf "$ROOT/dxvk.conf"
          (cd "$ROOT" && find . -type f | LC_ALL=C sort | xargs sha256sum > "$RUNNER_TEMP/SHA256SUMS" && mv "$RUNNER_TEMP/SHA256SUMS" .)
          mkdir -p dist
          tar -C "$RUNNER_TEMP" -cf - "$NAME" | zstd -19 -q -o "dist/$NAME.tar.zst"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.lane }}
          path: dist/*.tar.zst
          if-no-files-found: error

  moltenvk:
    name: universal MoltenVK
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: VKD3D-Proton-MacOS build scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VKD3D_PROTON_MACOS_REPO }}
          ref: ${{ env.VKD3D_PROTON_MACOS_REV }}
          path: vkd3d-proton-macos

      - name: Xcode
        run: |
          # the newest installed Xcode: MoltenVK's macOS 26 features need its SDK
          X="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)"
          sudo xcode-select -s "$X"
          xcodebuild -version
          SDK="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $SDK"
          [ "${SDK%%.*}" -ge 26 ] || { echo "MoltenVK needs the macOS 26 SDK or later, the runner's newest is $SDK" >&2; exit 1; }
          brew install zstd
          # fetch-sources.sh commits the patches it applies
          git config --global user.name "MetalSharp"
          git config --global user.email "metalsharp@users.noreply.github.com"

      - name: Sources
        working-directory: vkd3d-proton-macos
        run: bash scripts/fetch-sources.sh moltenvk

      - name: Build
        working-directory: vkd3d-proton-macos
        run: bash scripts/build-moltenvk.sh --externals

      - name: Package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION="$(git rev-parse --short HEAD)"
          NAME="moltenvk-$VERSION-universal"
          ROOT="$RUNNER_TEMP/$NAME"
          SRC=vkd3d-proton-macos
          mkdir -p "$ROOT"
          cp $SRC/artifacts/mvk-new/libMoltenVK.dylib $SRC/artifacts/mvk-new/MoltenVK_icd.json "$ROOT/"
          cp $SRC/sources/MoltenVK/LICENSE "$ROOT/LICENSE.MoltenVK"
          echo "Built by $VKD3D_PROTON_MACOS_REPO at $VKD3D_PROTON_MACOS_REV" > "$ROOT/SOURCE"
          codesign -f -s - "$ROOT/libMoltenVK.dylib"
          ARCHS="$(lipo -archs "$ROOT/libMoltenVK.dylib")"
          echo "libMoltenVK.dylib: $ARCHS"
          case " $ARCHS " in *" arm64 "*) ;; *) echo "no arm64 slice" >&2; exit 1 ;; esac
          case " $ARCHS " in *" x86_64 "*) ;; *) echo "no x86_64 slice" >&2; exit 1 ;; esac
          (cd "$ROOT" && find . -type f | LC_ALL=C sort | xargs shasum -a 256 > "$RUNNER_TEMP/SHA256SUMS" && mv "$RUNNER_TEMP/SHA256SUMS" .)
          mkdir -p dist
          tar -C "$RUNNER_TEMP" -cf - "$NAME" | zstd -19 -q -o "dist/$NAME.tar.zst"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: moltenvk
          path: dist/*.tar.zst
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dlls, moltenvk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          cat > notes.md <<EOF
          Built from $GITHUB_SHA. Each package holds its files, their licenses and SHA256SUMS.

          - **dxvk-macos-$TAG-x86_64**: \`d3d8.dll\`, \`d3d9.dll\`, \`d3d10core.dll\`, \`d3d11.dll\` and \`dxgi.dll\` for x86_64 Windows programs (\`x86_64-windows\`).
          - **dxvk-macos-$TAG-i386**: the same for 32-bit Windows programs (\`i386-windows\`).
          - **dxvk-macos-$TAG-arm64x**: the same as ARM64X, for an arm64 Wine that runs x86_64 programs with FEX (MetalSharp Wine), which loads them as ARM64EC (\`x86_64-windows\`).
          - **moltenvk-$TAG-universal**: the universal (arm64 + x86_64), ad-hoc signed \`libMoltenVK.dylib\` and \`MoltenVK_icd.json\`, built by $VKD3D_PROTON_MACOS_REPO at $VKD3D_PROTON_MACOS_REV with its MoltenVK and SPIRV-Cross fixes.
          EOF
          gh release create "$TAG" dist/x86_64/*.tar.zst dist/i386/*.tar.zst dist/arm64x/*.tar.zst dist/moltenvk/*.tar.zst \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "DXVK-MacOS $TAG" --notes-file notes.md
